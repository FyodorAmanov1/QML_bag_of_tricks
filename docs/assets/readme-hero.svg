<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">QML Bag of Tricks</title>
  <desc id="desc">Make the quantum part count. Trainable methods, real baselines, reproducible experiments.</desc>
  <defs>
