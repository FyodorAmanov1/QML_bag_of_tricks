    <radialGradient id="glow"><stop stop-color="#c12337" stop-opacity=".8"/><stop offset="1" stop-color="#151515" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="430" rx="0" fill="#151515"/>
  <rect width="1280" height="430" rx="0" fill="url(#grid)"/>
  <ellipse cx="1040" cy="180" rx="300" ry="270" fill="url(#glow)"/>
  <g font-family="Arial,Helvetica,sans-serif">
