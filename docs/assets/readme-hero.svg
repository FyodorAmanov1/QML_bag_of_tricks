    <text x="49" y="260" font-size="18" fill="#d2d6da">Trainable methods. Real baselines. Reproducible experiments.</text>
    <text x="49" y="349" font-size="15" font-weight="700" fill="#ffffff">QISKIT</text>
    <circle cx="124" cy="344" r="2" fill="#f07d8b"/>
    <text x="144" y="349" font-size="15" font-weight="700" fill="#ffffff">PENNYLANE</text>
    <circle cx="255" cy="344" r="2" fill="#f07d8b"/>
    <text x="275" y="349" font-size="15" font-weight="700" fill="#ffffff">CIRQ</text>
    <text x="49" y="382" font-size="13" fill="#bcbec5">Choose a useful task → build a native model → benchmark the result</text>
  </g>
  <g transform="translate(855 74)">
    <circle cx="150" cy="135" r="116" fill="none" stroke="#d2d6da" stroke-opacity=".35"/>
