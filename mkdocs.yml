site_name: QML Bag of Tricks
site_description: Start with QML Utility, benchmark native models and explore the QML research library in Qiskit, PennyLane and Cirq
site_url: https://fyodoramanov1.github.io/QML_bag_of_tricks/
theme:
  name: material
  custom_dir: overrides
  logo: assets/qml-mark.svg
  favicon: assets/qml-mark.svg
  font: false
  features:
    - navigation.sections
    - content.code.copy
plugins:
  - search
hooks:
  - scripts/docs_sources.py
markdown_extensions:
  - tables
  - fenced_code
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - assets/showcase.js
  - assets/agent-handoff.js
extra_css:
  - assets/showcase.css
