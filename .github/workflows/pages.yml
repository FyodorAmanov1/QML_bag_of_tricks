name: Website preview and publication
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the full documentation publicly via GitHub Pages
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[docs]"
      - run: python scripts/build_showcase.py --check
      - run: python -m mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: qml-website-preview
          path: site
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.publish }}
        with:
          path: site
  deploy:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
