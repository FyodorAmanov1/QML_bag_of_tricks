name: Checks
on: [push, pull_request]
jobs:
  recipes:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[all,learning,notebooks,dev,docs]"
      - run: python scripts/run_notebooks.py
      - run: python -m pytest -q
      - run: python scripts/audit_opportunity_results.py
      - run: python scripts/audit_paper_results.py
      - run: python scripts/build_showcase.py --check
      - run: python -m mkdocs build --strict
      - run: python -m build
